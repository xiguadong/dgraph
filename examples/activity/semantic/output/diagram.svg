<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="-apple-system, PingFang SC, Hiragino Sans GB, Noto Sans SC, sans-serif" data-layout="activity">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="triangle" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#fff" stroke="#64748b" stroke-width="1.4"/></marker></defs>
<rect width="1280" height="720" fill="#fff"/>
<text x="48" y="52" font-size="28" fill="#15202b" text-anchor="start" font-weight="750">CanSat CS-1｜活动图 Activity</text>
<text x="48" y="80" font-size="14" fill="#64748b" text-anchor="start" font-weight="400">动作、判断与控制流</text>
<line x1="48" y1="102" x2="1232" y2="102" stroke="#e2e8f0"/>
<path d="M 630.0,145 L 630.0,175" fill="none" stroke="#2459a6" stroke-width="2" stroke-dasharray="None" marker-end="url(#arrow)"/>
<path d="M 630.0,230 L 630.0,270" fill="none" stroke="#2459a6" stroke-width="2" stroke-dasharray="None" marker-end="url(#arrow)"/>
<path d="M 710,311.8103448275862 L 790,311.12068965517244" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="None" marker-end="url(#arrow)"/>
<path d="M 550,311.8220338983051 L 460,311.0593220338983" fill="none" stroke="#b42318" stroke-width="2" stroke-dasharray="None" marker-end="url(#arrow)"/>
<path d="M 920.0,340 L 920.0,410" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="None" marker-end="url(#arrow)"/>
<path d="M 335.0,340 L 335.0,410" fill="none" stroke="#b42318" stroke-width="2" stroke-dasharray="None" marker-end="url(#arrow)"/>
<path d="M 920,470 L 920,548 L 760,548" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="None" marker-end="url(#arrow)"/>
<path d="M 335,470 L 335,548 L 500,548" fill="none" stroke="#b42318" stroke-width="2" stroke-dasharray="None" marker-end="url(#arrow)"/>
<g data-node-id="start" data-source-id="CanSat.Activity.start" data-kind="initial"><title>开始</title><circle cx="630.0" cy="130.0" r="15.0" fill="#64748b"/><text x="630.0" y="169" font-size="14" fill="#334155" text-anchor="middle" font-weight="400">开始</text></g>
<g data-node-id="selftest" data-source-id="CanSat.SelfTest" data-kind="action"><title>自检</title><rect x="500" y="175" width="260" height="55" rx="18" fill="#e4f3ef" stroke="#0f766e" stroke-width="2"/><text x="630.0" y="207.5" font-size="16" fill="#334155" text-anchor="middle" font-weight="600">自检</text></g>
<g data-node-id="decision" data-source-id="CanSat.VoltageDecision" data-kind="decision"><title>电压 ≥ 6.4 V？</title><polygon points="630.0,270 710,312.5 630.0,355 550,312.5" fill="#fdf4e1" stroke="#a16207" stroke-width="2"/><text x="630.0" y="317.5" font-size="16" fill="#334155" text-anchor="middle" font-weight="600">电压 ≥ 6.4 V？</text></g>
<g data-node-id="sample" data-source-id="CanSat.SamplePack" data-kind="action"><title>采样并打包</title><rect x="790" y="280" width="260" height="60" rx="18" fill="#e4f3ef" stroke="#0f766e" stroke-width="2"/><text x="920.0" y="315.0" font-size="16" fill="#334155" text-anchor="middle" font-weight="600">采样并打包</text></g>
<g data-node-id="safe" data-source-id="CanSat.EnterSafe" data-kind="action"><title>进入安全模式</title><rect x="210" y="280" width="250" height="60" rx="18" fill="#fdecea" stroke="#b42318" stroke-width="2"/><text x="335.0" y="315.0" font-size="16" fill="#334155" text-anchor="middle" font-weight="600">进入安全模式</text></g>
<g data-node-id="send" data-source-id="CanSat.Transmit" data-kind="action"><title>下传遥测帧</title><rect x="790" y="410" width="260" height="60" rx="18" fill="#e4f3ef" stroke="#0f766e" stroke-width="2"/><text x="920.0" y="445.0" font-size="16" fill="#334155" text-anchor="middle" font-weight="600">下传遥测帧</text></g>
<g data-node-id="heartbeat" data-source-id="CanSat.Heartbeat" data-kind="action"><title>仅发送心跳</title><rect x="210" y="410" width="250" height="60" rx="18" fill="#fdecea" stroke="#b42318" stroke-width="2"/><text x="335.0" y="445.0" font-size="16" fill="#334155" text-anchor="middle" font-weight="600">仅发送心跳</text></g>
<g data-node-id="store" data-source-id="CanSat.StoreData" data-kind="action"><title>写入本地存储</title><rect x="500" y="520" width="260" height="55" rx="18" fill="#e8f0ff" stroke="#2459a6" stroke-width="2"/><text x="630.0" y="552.5" font-size="16" fill="#173d73" text-anchor="middle" font-weight="600">写入本地存储</text></g>


<rect x="735" y="254" width="34" height="21" rx="4" fill="#fff" fill-opacity=".94"/><text x="752" y="270" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="500">[是]</text>
<rect x="445" y="254" width="34" height="21" rx="4" fill="#fff" fill-opacity=".94"/><text x="462" y="270" font-size="13" fill="#b42318" text-anchor="middle" font-weight="500">[否]</text>




<text x="55" y="630" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">正常遥测与安全心跳均保留本地数据；低电压时降低采样率。</text>
<text x="48" y="690" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">CS-1 从自检到遥测下传的活动顺序和低电压分支是什么？</text>
<text x="1232" y="690" font-size="12" fill="#94a3b8" text-anchor="end" font-weight="400">dgraph · semantic projection</text>
</svg>
