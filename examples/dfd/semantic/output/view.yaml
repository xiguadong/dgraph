  matrices: []
  charts: []
  timelines: []
  qfd: null
  gantt: null
  faultTree: null
  c4Container: null
  umlClass: null
  sequenceModel: null
  n2Model: null
  dfdModel:
    entities:
      - id: "sensors"
        label: "传感器"
        x: 55
        y: 255
      - id: "ground"
        label: "地面站"
        x: 1010
        y: 255
      - id: "operator"
        label: "回收人员"
        x: 1010
        y: 455
    processes:
      - id: "sampling"
        label: "采样与打包"
        x: 355
        y: 255
      - id: "routing"
        label: "遥测路由"
        x: 665
        y: 255
