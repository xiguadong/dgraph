schema: "diagram-view/v1"
type: "dfd"
intent:
  question: "How does data move between processes, stores, and external entities?"
sources:
  - kind: "semantic"
    example: "se-dfd"
selection:
  layout: "dfd"
  nodes:
    - id: "n0"
      label: "传感器"
      kind: "block"
      x: 55
      y: 280
      w: 210
      h: 95
      color: "gray"
      sourceId: "Example.se-dfd.n0"
    - id: "n1"
      label: "采样处理"
      kind: "usecase"
      x: 370
      y: 280
      w: 230
      h: 100
      color: "teal"
      sourceId: "Example.se-dfd.n1"
    - id: "n2"
      label: "数据存储"
      kind: "datastore"
      x: 680
      y: 280
      w: 220
      h: 95
      color: "amber"
      sourceId: "Example.se-dfd.n2"
    - id: "n3"
      label: "地面站"
      kind: "block"
      x: 1000
      y: 280
      w: 210
      h: 95
      color: "violet"
      sourceId: "Example.se-dfd.n3"
  edges:
    - source: "n0"
      target: "n1"
      kind: "flow"
      color: "teal"
      label: "原始采样"
    - source: "n1"
      target: "n2"
      kind: "flow"
      color: "teal"
      label: "遥测帧"
    - source: "n2"
      target: "n3"
      kind: "flow"
      color: "teal"
