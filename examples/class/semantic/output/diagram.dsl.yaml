schema: "diagram-ir/v1"
type: "class"
layout: "class"
nodes:
  - id: "n0"
    label: "Sensor"
    kind: "class"
    x: 90
    y: 150
    w: 260
    h: 120
    color: "blue"
    sourceId: "Example.uml-class.n0"
    compartment: "attributes\nmethods"
  - id: "n1"
    label: "TelemetryFrame"
    kind: "class"
    x: 480
    y: 150
    w: 300
    h: 120
    color: "teal"
    sourceId: "Example.uml-class.n1"
    compartment: "timestamp\nvalues"
  - id: "n2"
    label: "Mission"
    kind: "class"
    x: 90
    y: 420
    w: 260
    h: 110
    color: "violet"
    sourceId: "Example.uml-class.n2"
    compartment: "state\ntransitions"
  - id: "n3"
    label: "GroundStation"
    kind: "class"
    x: 850
    y: 420
    w: 280
    h: 110
    color: "gray"
    sourceId: "Example.uml-class.n3"
    compartment: "receive()"
edges:
  - source: "n2"
    target: "n0"
    kind: "generalization"
    color: "teal"
    label: "uses"
  - source: "n0"
    target: "n1"
    kind: "composition"
    color: "teal"
    label: "produces"
  - source: "n1"
    target: "n3"
    kind: "dependency"
    color: "teal"
    label: "sent to"
groups: []
matrices: []
charts: []
timelines: []
qfd: null
gantt: null
faultTree: null
c4Container: null
umlClass:
  classes:
    - id: "GroundStation"
      x: 70
      y: 150
      attributes:
        - "stationId: String"
        - "mode: Mode"
      operations:
        - "startSession()"
    - id: "Mission"
      x: 700
      y: 150
      attributes:
        - "id: String"
        - "startTime: Time"
      operations:
        - "archive()"
    - id: "Sensor"
      x: 70
      y: 410
      attributes:
        - "kind: SensorType"
        - "rateHz: int"
      operations:
        - "sample()"
    - id: "TelemetryFrame"
      x: 700
      y: 410
      attributes:
        - "ts: Time"
        - "t, p, rh: float"
      operations:
        - "crcOk(): bool"
  relations:
    - id: "manages"
      source: "GroundStation"
      target: "Mission"
      sourceMultiplicity: "1"
      targetMultiplicity: "1"
      points:
        - - 350
- 235
        - - 700
- 235
    - id: "records"
      source: "Mission"
      target: "TelemetryFrame"
      sourceMultiplicity: "1"
      targetMultiplicity: "0..*"
      points:
        - - 840
- 300
        - - 840
- 410
    - id: "produces"
      source: "Sensor"
      target: "TelemetryFrame"
      sourceMultiplicity: "1"
      targetMultiplicity: "0..*"
      points:
        - - 350
- 495
        - - 700
- 495
sequenceModel: null
n2Model: null
dfdModel: null
bpmnModel: null
annotations: []
