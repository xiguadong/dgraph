    - id: "5"
      conditions:
        - "—"
        - "—"
        - "—"
        - "< 6"
      result: "Hold"
    - id: "6"
      conditions:
        - "≤ 8"
        - "≥ 7.0"
        - "通过"
        - "≥ 6"
