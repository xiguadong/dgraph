<g data-fta="fault-tree" data-source-id="Example.fta"><rect x="500" y="130" width="280" height="70" rx="8" fill="#fdecea" stroke="#b42318" stroke-width="2" /><text x="640" y="158" font-size="12" fill="#b42318" text-anchor="middle" font-weight="400">顶事件 TE-1</text><text x="640" y="182" font-size="17" fill="#b42318" text-anchor="middle" font-weight="700">遥测中断</text><g data-fta-gate="or"><path d="M 595 250 Q 640 235 685 250 C 685 265 655 290 640 303 C 625 290 595 265 595 250 Z" fill="#fff" stroke="#b42318" stroke-width="2"/><text x="640" y="273" font-size="14" fill="#b42318" text-anchor="middle" font-weight="700">OR</text></g><line x1="640" y1="200" x2="640" y2="230" stroke="#64748b" stroke-width="1.8"/><line x1="640" y1="303" x2="640" y2="345" stroke="#64748b" stroke-width="1.8"/><line x1="150" y1="345" x2="1130" y2="345" stroke="#64748b" stroke-width="1.8"/><line x1="190" y1="345" x2="190" y2="425" stroke="#64748b" stroke-width="1.8"/><g data-fta-basic-event="battery"><rect x="70" y="425" width="240" height="85" rx="7" fill="#fff" stroke="#b42318" stroke-width="1.8" /><text x="190" y="458" font-size="15" fill="#b42318" text-anchor="middle" font-weight="700">电池耗尽</text><text x="190" y="485" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">低温容量下降</text></g><line x1="490" y1="345" x2="490" y2="425" stroke="#64748b" stroke-width="1.8"/><g data-fta-basic-event="antenna"><rect x="370" y="425" width="240" height="85" rx="7" fill="#fff" stroke="#b42318" stroke-width="1.8" /><text x="490" y="458" font-size="15" fill="#b42318" text-anchor="middle" font-weight="700">天线断裂</text><text x="490" y="485" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">开伞冲击 / 弯折</text></g><line x1="790" y1="345" x2="790" y2="425" stroke="#64748b" stroke-width="1.8"/><g data-fta-basic-event="deadlock"><rect x="670" y="425" width="240" height="85" rx="7" fill="#fff" stroke="#b42318" stroke-width="1.8" /><text x="790" y="458" font-size="15" fill="#b42318" text-anchor="middle" font-weight="700">软件死锁</text><text x="790" y="485" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">看门狗未复位</text></g><line x1="1090" y1="345" x2="1090" y2="425" stroke="#64748b" stroke-width="1.8"/><g data-fta-basic-event="ground-lock"><rect x="970" y="425" width="240" height="85" rx="7" fill="#fff" stroke="#b42318" stroke-width="1.8" /><text x="1090" y="458" font-size="15" fill="#b42318" text-anchor="middle" font-weight="700">地面站失锁</text><text x="1090" y="485" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">遮挡 / 干扰</text></g><text x="70" y="570" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">OR 门：任一底事件发生即顶事件；底事件可继续映射到 FMEA 失效模式。</text></g>
