<rect x="50" y="394" width="42" height="21" rx="4" fill="#fff" fill-opacity=".94"/><text x="71" y="410" font-size="13" fill="#b42318" text-anchor="middle" font-weight="500">电压恢复</text>
<text x="70" y="625" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">状态是持续条件，迁移由事件或守卫触发；与活动图中的动作步骤保持区分。</text>
<text x="48" y="690" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">CS-1 的任务状态如何迁移，低电压安全模式如何打断正常任务链？</text>
<text x="1232" y="690" font-size="12" fill="#94a3b8" text-anchor="end" font-weight="400">dgraph · semantic projection</text>
