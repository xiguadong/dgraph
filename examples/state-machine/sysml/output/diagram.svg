<g data-node-id="armed" data-source-id="CanSat.Armed" data-kind="state"><title>待发射 Armed</title><rect x="375" y="190" width="210" height="70" rx="18" fill="#e8f0ff" stroke="#2459a6" stroke-width="2"/><text x="480.0" y="230.0" font-size="16" fill="#173d73" text-anchor="middle" font-weight="600">待发射 Armed</text></g>
