<text x="200" y="620" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">接口编号保留在端口旁；系统边界外部只显示地面站，不把外部环境混入内部组成。</text>
<text x="48" y="690" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">CS-1 内部部件通过哪些端口和接口连接，外部下行链路在哪里？</text>
<text x="1232" y="690" font-size="12" fill="#94a3b8" text-anchor="end" font-weight="400">dgraph · semantic projection</text>
