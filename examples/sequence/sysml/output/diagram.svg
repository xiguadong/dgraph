<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="-apple-system, PingFang SC, Hiragino Sans GB, Noto Sans SC, sans-serif" data-layout="sequence">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1280" height="720" fill="#fff"/>
<text x="48" y="52" font-size="28" fill="#15202b" text-anchor="start" font-weight="750">CanSat CS-1｜序列图 Sequence</text>
<text x="48" y="80" font-size="14" fill="#64748b" text-anchor="start" font-weight="400">下降段遥测场景 · 消息自上而下排列</text>
<line x1="48" y1="102" x2="1232" y2="102" stroke="#e2e8f0"/>
<g data-sequence="interaction"><g data-sequence-lifeline="sensor" data-source-id="Example.sequence.sensor"><rect x="65" y="130" width="170" height="58" rx="3" fill="#e8f0ff" stroke="#2459a6" stroke-width="1.8" /><text x="150" y="165" font-size="15" fill="#15202b" text-anchor="middle" font-weight="650">传感器</text><line x1="150" y1="188" x2="150" y2="625" stroke="#94a3b8" stroke-dasharray="5 5"/></g><g data-sequence-lifeline="fcu" data-source-id="Example.sequence.fcu"><rect x="365" y="130" width="170" height="58" rx="3" fill="#e8f0ff" stroke="#2459a6" stroke-width="1.8" /><text x="450" y="165" font-size="15" fill="#15202b" text-anchor="middle" font-weight="650">飞控</text><line x1="450" y1="188" x2="450" y2="625" stroke="#94a3b8" stroke-dasharray="5 5"/></g><g data-sequence-lifeline="radio" data-source-id="Example.sequence.radio"><rect x="665" y="130" width="170" height="58" rx="3" fill="#e8f0ff" stroke="#2459a6" stroke-width="1.8" /><text x="750" y="165" font-size="15" fill="#15202b" text-anchor="middle" font-weight="650">电台</text><line x1="750" y1="188" x2="750" y2="625" stroke="#94a3b8" stroke-dasharray="5 5"/></g><g data-sequence-lifeline="ground" data-source-id="Example.sequence.ground"><rect x="965" y="130" width="170" height="58" rx="3" fill="#e8f0ff" stroke="#2459a6" stroke-width="1.8" /><text x="1050" y="165" font-size="15" fill="#15202b" text-anchor="middle" font-weight="650">地面站</text><line x1="1050" y1="188" x2="1050" y2="625" stroke="#94a3b8" stroke-dasharray="5 5"/></g><rect data-sequence-activation="fcu" x="444" y="218" width="12" height="52" fill="#e4f3ef" stroke="#0f766e" stroke-width="1.5"/><path data-sequence-return="false" d="M 450 230 H 150" fill="none" stroke="#2459a6" stroke-width="1.8" stroke-dasharray="None" marker-end="url(#arrow)"/><text x="300.0" y="218" font-size="13" fill="#334155" text-anchor="middle" font-weight="500">1 读取采样</text><rect data-sequence-activation="sensor" x="144" y="283" width="12" height="52" fill="#e4f3ef" stroke="#0f766e" stroke-width="1.5"/><path data-sequence-return="true" d="M 150 295 H 450" fill="none" stroke="#2459a6" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="300.0" y="283" font-size="13" fill="#334155" text-anchor="middle" font-weight="500">2 温压湿 / IMU / GPS</text><path data-sequence-return="false" d="M 450 360 H 555 V 392 H 450" fill="none" stroke="#2459a6" stroke-width="1.8" stroke-dasharray="None" marker-end="url(#arrow)"/><text x="468" y="348" font-size="13" fill="#334155" text-anchor="start" font-weight="400">3 打包 TelemetryFrame</text><path data-sequence-return="false" d="M 450 425 H 750" fill="none" stroke="#2459a6" stroke-width="1.8" stroke-dasharray="None" marker-end="url(#arrow)"/><text x="600.0" y="413" font-size="13" fill="#334155" text-anchor="middle" font-weight="500">4 UART 遥测帧</text><rect data-sequence-activation="radio" x="744" y="478" width="12" height="52" fill="#e4f3ef" stroke="#0f766e" stroke-width="1.5"/><path data-sequence-return="false" d="M 750 490 H 1050" fill="none" stroke="#2459a6" stroke-width="1.8" stroke-dasharray="None" marker-end="url(#arrow)"/><text x="900.0" y="478" font-size="13" fill="#334155" text-anchor="middle" font-weight="500">5 433 MHz 下行</text><rect data-sequence-activation="ground" x="1044" y="543" width="12" height="52" fill="#e4f3ef" stroke="#0f766e" stroke-width="1.5"/><path data-sequence-return="true" d="M 1050 555 H 450" fill="none" stroke="#2459a6" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="750.0" y="543" font-size="13" fill="#334155" text-anchor="middle" font-weight="500">6 接收确认（下一场景）</text></g>
<text x="70" y="625" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">生命线表示参与者；消息顺序是场景语义，不等同于状态迁移或项目时间计划。</text>
<text x="48" y="690" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">一次下降段遥测交互中，传感器、飞控、电台与地面站按什么顺序交换消息？</text>
<text x="1232" y="690" font-size="12" fill="#94a3b8" text-anchor="end" font-weight="400">dgraph · semantic projection</text>
</svg>
