<line x1="165.0" y1="185" x2="165.0" y2="635" stroke="#94a3b8" stroke-dasharray="5 5"/>
<line x1="475.0" y1="185" x2="475.0" y2="635" stroke="#94a3b8" stroke-dasharray="5 5"/>
<line x1="785.0" y1="185" x2="785.0" y2="635" stroke="#94a3b8" stroke-dasharray="5 5"/>
<line x1="1095.0" y1="185" x2="1095.0" y2="635" stroke="#94a3b8" stroke-dasharray="5 5"/>
<path d="M 475,235 L 165,235" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="None" marker-end="url(#arrow)"/>
<path d="M 165,295 L 475,295" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<path d="M 475,350 L 590,350 L 590,385 L 475,385" fill="none" stroke="#2459a6" stroke-width="2" stroke-dasharray="None" marker-end="url(#arrow)"/>
<path d="M 475,440 L 785,440" fill="none" stroke="#6d28d9" stroke-width="2" stroke-dasharray="None" marker-end="url(#arrow)"/>
<path d="M 785,500 L 1095,500" fill="none" stroke="#6d28d9" stroke-width="2" stroke-dasharray="None" marker-end="url(#arrow)"/>
<path d="M 1095,560 L 475,560" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<g data-node-id="sensor" data-source-id="CanSat.CS1.sensors" data-kind="block"><title>传感器</title><rect x="75" y="130" width="180" height="55" rx="6" fill="#e4f3ef" stroke="#0f766e" stroke-width="2"/><text x="165.0" y="162.5" font-size="16" fill="#334155" text-anchor="middle" font-weight="600">传感器</text></g>
<g data-node-id="fcu" data-source-id="CanSat.CS1.fcu" data-kind="block"><title>飞控</title><rect x="385" y="130" width="180" height="55" rx="6" fill="#e8f0ff" stroke="#2459a6" stroke-width="2"/><text x="475.0" y="162.5" font-size="16" fill="#173d73" text-anchor="middle" font-weight="600">飞控</text></g>
<g data-node-id="radio" data-source-id="CanSat.CS1.comms" data-kind="block"><title>电台</title><rect x="695" y="130" width="180" height="55" rx="6" fill="#f1ebfd" stroke="#6d28d9" stroke-width="2"/><text x="785.0" y="162.5" font-size="16" fill="#334155" text-anchor="middle" font-weight="600">电台</text></g>
<g data-node-id="ground" data-source-id="CanSat.GroundStation" data-kind="block"><title>地面站</title><rect x="1005" y="130" width="180" height="55" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="1095.0" y="162.5" font-size="16" fill="#334155" text-anchor="middle" font-weight="600">地面站</text></g>
<rect x="275" y="199" width="58" height="21" rx="4" fill="#fff" fill-opacity=".94"/><text x="304" y="215" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="500">1 读取采样</text>
<rect x="220" y="259" width="146" height="21" rx="4" fill="#fff" fill-opacity=".94"/><text x="293" y="275" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="500">2 温压湿 / IMU / GPS</text>
<rect x="495" y="314" width="162" height="21" rx="4" fill="#fff" fill-opacity=".94"/><text x="576" y="330" font-size="13" fill="#2459a6" text-anchor="middle" font-weight="500">3 打包 TelemetryFrame</text>
<rect x="565" y="404" width="90" height="21" rx="4" fill="#fff" fill-opacity=".94"/><text x="610" y="420" font-size="13" fill="#6d28d9" text-anchor="middle" font-weight="500">4 UART 遥测帧</text>
<rect x="885" y="464" width="106" height="21" rx="4" fill="#fff" fill-opacity=".94"/><text x="938" y="480" font-size="13" fill="#6d28d9" text-anchor="middle" font-weight="500">5 433 MHz 下行</text>
<rect x="715" y="524" width="106" height="21" rx="4" fill="#fff" fill-opacity=".94"/><text x="768" y="540" font-size="13" fill="#64748b" text-anchor="middle" font-weight="500">6 接收确认（下一场景）</text>
<text x="70" y="625" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">生命线表示参与者；消息顺序是场景语义，不等同于状态迁移或项目时间计划。</text>
<text x="48" y="690" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">一次下降段遥测交互中，传感器、飞控、电台与地面站按什么顺序交换消息？</text>
<text x="1232" y="690" font-size="12" fill="#94a3b8" text-anchor="end" font-weight="400">dgraph · semantic projection</text>
</svg>
