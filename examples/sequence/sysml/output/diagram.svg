<rect width="1280" height="720" fill="#fff"/>
<text x="48" y="52" font-size="28" fill="#15202b" text-anchor="start" font-weight="750">CanSat CS-1｜序列图 Sequence</text>
<text x="48" y="80" font-size="14" fill="#64748b" text-anchor="start" font-weight="400">下降段遥测场景 · 消息自上而下排列</text>
